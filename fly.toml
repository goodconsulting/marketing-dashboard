app = "stack-dashboard"
primary_region = "ord"

[build]

[[mounts]]
  source = "data"
  destination = "/data"
  initial_size = "1gb"

[env]
  NODE_ENV = "production"
  DB_PATH = "/data/stack.db"
  PORT = "3000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
